name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - run: mkdir -p build && javac -d build src/main/java/br/com/mateus/biblioteca/Library.java tests/LibraryTest.java && java -ea -cp build LibraryTest
